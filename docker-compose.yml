services:
  postgres:
    container_name: trackgeek-postgres
    image: postgres:18
    restart: always
    ports:
      - '20141:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trackgeek
    volumes:
      - postgres-data:/var/lib/postgresql

  postgres-exporter:
    container_name: trackgeek-postgres-exporter
    image: bitnami/postgres-exporter:latest
    restart: always
    environment:
      DATA_SOURCE_URI: 'postgres:5432/trackgeek?sslmode=disable'
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: postgres
    ports:
      - '9187:9187'
    depends_on:
      - postgres

  redis:
    container_name: trackgeek-redis
    image: redis:6
    restart: always
    command: redis-server --requirepass redis
    ports:
      - '18209:6379'
    volumes:
      - redis-data:/data

  redis-exporter:
    container_name: trackgeek-redis-exporter
    image: oliver006/redis_exporter:latest
    restart: always
    environment:
      REDIS_ADDR: 'redis://redis:6379'
      REDIS_PASSWORD: redis
    ports:
      - '9121:9121'
    depends_on:
      - redis

  prometheus:
    container_name: trackgeek-prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - '36573:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - postgres-exporter
      - redis-exporter

volumes:
  postgres-data:
  redis-data:
  prometheus-data:

networks:
  default:
    name: trackgeek
    driver: bridge