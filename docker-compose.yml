services:
  postgres:
    container_name: trackgeek-postgres
    image: postgres:13
    restart: always
    ports:
      - '20141:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trackgeek
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    container_name: trackgeek-redis
    image: redis:6
    restart: always
    command: redis-server --requirepass redis
    ports:
      - '18209:6379'
    volumes:
      - redis-data:/data
      
volumes:
  postgres-data:
  redis-data:
  
networks:
  default:
    name: trackgeek
    driver: bridge