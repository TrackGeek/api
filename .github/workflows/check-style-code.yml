name: Check Style Code

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types:
      - opened
      - reopened
    branches:
      - main
      - develop

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format
        
      - name: Check linting
        run: npm run lint
