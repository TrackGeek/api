name: Unit Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types:
      - opened
      - reopened
    branches:
      - main
      - develop

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Generate Prisma client
        run: bun prisma:generate

      - name: Run unit tests
        run: bun test:unit
